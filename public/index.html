<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Highlight.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/default.min.css">
  
  <style>
    body.dark {
      background-color: #121212;
      color: #ffffff;
    }
    body.light {
      background-color: #f8f9fa;
      color: #212529;
    }
    pre {
      background-color: #1e1e1e;
      color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-x: auto;
      font-size: 16px;
    }
    body.light pre {
      background-color: #e9ecef;
      color: #212529;
    }
    .file-button {
      margin: 5px;
    }
    h1, h2, label {
      color: inherit;
    }
    .form-select, .btn, .form-control {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
    }
    body.light .form-select,
    body.light .btn,
    body.light .form-control {
      background-color: #ffffff;
      color: #212529;
      border: 1px solid #ced4da;
    }
    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body class="dark">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Code Viewer</h1>
      <button id="theme-toggle" class="btn btn-primary">Switch Theme</button>
    </div>

    <!-- Controls -->
    <div class="row mb-3">
      <div class="col-md-3">
        <label for="lang-select" class="form-label">Select Language:</label>
        <select id="lang-select" class="form-select">
          <option value="Java">Java</option>
          <option value="C">C</option>
          <option value="Python">Python</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="sort-select" class="form-label">Sort by:</label>
        <select id="sort-select" class="form-select">
          <option value="az">A-Z</option>
          <option value="za">Z-A</option>
          <option value="latest">Latest Updated</option>
          <option value="oldest">Oldest Updated</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="search-input" class="form-label">Search files:</label>
        <input type="text" id="search-input" class="form-control" placeholder="Type to search...">
      </div>
      <div class="col-md-3">
        <label for="font-size" class="form-label">Font Size:</label>
        <select id="font-size" class="form-select">
          <option value="14px">Small</option>
          <option value="16px" selected>Medium</option>
          <option value="18px">Large</option>
          <option value="20px">X-Large</option>
        </select>
      </div>
    </div>

    <!-- File Buttons -->
    <div id="file-list" class="mb-4"></div>

    <!-- Code Display -->
    <h2>Code:</h2>
    <pre><code id="code-display" class="language-java">// Select a file to view its code</code></pre>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Highlight.js -->
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/common.min.js"></script>
  <script>hljs.highlightAll();</script>

  <script>
    const langSelect = document.getElementById('lang-select');
    const sortSelect = document.getElementById('sort-select');
    const searchInput = document.getElementById('search-input');
    const fontSizeSelect = document.getElementById('font-size');
    const fileListDiv = document.getElementById('file-list');
    const codeDisplay = document.getElementById('code-display');
    const themeToggle = document.getElementById('theme-toggle');

    let currentFiles = [];

    langSelect.addEventListener('change', loadFiles);
    sortSelect.addEventListener('change', renderFiles);
    searchInput.addEventListener('input', renderFiles);
    fontSizeSelect.addEventListener('change', () => {
      codeDisplay.style.fontSize = fontSizeSelect.value;
    });
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      document.body.classList.toggle('light');
    });

    function loadFiles() {
      const lang = langSelect.value;
      fetch(`/api/files?lang=${lang}`)
        .then(res => res.json())
        .then(files => {
          currentFiles = files;
          renderFiles();
        });
    }

    function renderFiles() {
      const search = searchInput.value.toLowerCase();
      const sortBy = sortSelect.value;
      let filteredFiles = currentFiles.filter(file => file.name.toLowerCase().includes(search));

      // Sorting
      if (sortBy === 'az') {
        filteredFiles.sort((a, b) => a.name.localeCompare(b.name));
      } else if (sortBy === 'za') {
        filteredFiles.sort((a, b) => b.name.localeCompare(a.name));
      } else if (sortBy === 'latest') {
        filteredFiles.sort((a, b) => new Date(b.modified) - new Date(a.modified));
      } else if (sortBy === 'oldest') {
        filteredFiles.sort((a, b) => new Date(a.modified) - new Date(b.modified));
      }

      fileListDiv.innerHTML = '';
      filteredFiles.forEach(file => {
        const btn = document.createElement('button');
        btn.textContent = file.name;
        btn.className = 'btn btn-secondary file-button';
        btn.onclick = () => loadCode(langSelect.value, file.name);
        fileListDiv.appendChild(btn);
      });
    }

    function loadCode(lang, file) {
      fetch(`/api/code?lang=${lang}&file=${file}`)
        .then(res => res.text())
        .then(code => {
          codeDisplay.textContent = code;

          // Set language class for highlight.js
          codeDisplay.className = 'language-' + getHighlightLang(lang);

          hljs.highlightElement(codeDisplay);
        });
    }

    function getHighlightLang(lang) {
      if (lang.toLowerCase() === 'c') return 'c';
      if (lang.toLowerCase() === 'java') return 'java';
      if (lang.toLowerCase() === 'python') return 'python';
      return 'plaintext';
    }

    loadFiles();
  </script>
</body>
</html>
